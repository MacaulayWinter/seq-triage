---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::nanoplot=1.48.0
  # seq-triage patch (CLAUDE.md CI fix log #1, 2026-10-20; re-pinned for
  # 1.48.0, 2026-10-27): pin to the versions inside the module's container.
  # Unpinned, conda can install newer plotting libraries than NanoPlot was
  # built against (1.47.0 crashed on a removed plotly function).
  - conda-forge::plotly=6.9.0
  - conda-forge::python-kaleido=1.3.0
  - conda-forge::python=3.14
